<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инициализация...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Логотип в левом верхнем углу */
        .brand-logo {
            position: absolute;
            top: 24px;
            left: 24px;
            width: clamp(100px, 15vw, 150px);
            height: auto;
        }

        /* Центральный контейнер */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 25px;
            width: 100%;
            max-width: 800px;
        }

        /* Текст 32px, не жирный */
        .status-text {
            font-size: 32px;
            font-weight: normal;
            line-height: 1.3;
            word-wrap: break-word;
        }

        /* Адаптивная гифка */
        .init-gif {
            width: min(80vw, 280px);
            height: auto;
        }

        /* Незаметная надпись в нижнем левом углу */
        .device-info {
            position: absolute;
            bottom: 16px;
            left: 16px;
            font-size: 12px;
            color: #b0b0b0; /* Очень тусклый серый цвет */
            font-weight: normal;
            user-select: none;
        }

        /* Динамическое переключение типа устройства на чистом CSS */
        .dev-mobile { display: none; }
        .dev-desktop { display: inline; }

        /* Настройки для мобильных экранов */
        @media (max-width: 768px) {
            .dev-mobile { display: inline; }
            .dev-desktop { display: none; }

            .brand-logo {
                position: static;
                margin-bottom: 20px;
                width: 120px;
            }
        }
    </style>
</head>
<body>

    <!-- Логотип из корня -->
    <img src="../brand.png" alt="Brand Logo" class="brand-logo">

    <!-- Главный блок -->
    <div class="main-container">
        <div class="status-text">
            Пожалуйста, подождите.<br>
            Инициализация...
        </div>
        <img src="../init.gif" alt="Initialization..." class="init-gif">
    </div>

    <!-- Незаметный статус устройства в углу -->
    <div class="device-info">
        current_device:<span class="dev-mobile">Mobile</span><span class="dev-desktop">Desktop</span>
    </div>

</body>
</html>
